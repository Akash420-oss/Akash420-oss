<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" width="900" height="12" role="img" aria-label="Animated divider">
  <title>Animated divider</title>
  <desc>A dormant violet rail with a packet of light sweeping across it on a loop.</desc>
  <defs>
    <!-- Transparent at both ends so the packet fades in and out of the rail
         rather than appearing as a rectangle with hard edges. -->
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#6D28D9" stop-opacity="0.8"/>
      <stop offset="52%"  stop-color="#D8B4FE" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-20%" y="-600%" width="140%" height="1300%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dormant rail -->
  <rect x="0" y="5" width="900" height="2" fill="#6D28D9" opacity="0.3"/>

  <!-- end terminators, brightest at the left where the eye enters -->
  <rect x="0"   y="2" width="2" height="8" fill="#D8B4FE" opacity="0.75"/>
  <rect x="898" y="2" width="2" height="8" fill="#6D28D9" opacity="0.75"/>

  <!-- travelling packet -->
  <g filter="url(#bloom)">
    <rect x="0" y="4" width="270" height="4" rx="2" fill="url(#packet)" transform="translate(-290 0)">
      <animateTransform attributeName="transform" type="translate"
                        from="-290 0" to="900 0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Trailing echo, offset half a cycle so the rail never reads as empty.
       The initial transform parks it off-canvas; without it the rect would sit
       visible at x=0 for the first 1.8s before its animation begins. -->
  <g filter="url(#bloom)" opacity="0.4">
    <rect x="0" y="5" width="120" height="2" rx="1" fill="url(#packet)" transform="translate(-140 0)">
      <animateTransform attributeName="transform" type="translate"
                        from="-140 0" to="900 0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
